name: Update README cards

on:
  schedule:
    - cron: "30 */12 * * *"
  push:
    paths:
      - ".github/workflows/readme-cards.yml"
  workflow_dispatch:

env:
  THEME: title_color=DC2626&icon_color=DC2626&text_color=FFFFFF&bg_color=000000&border_color=DC2626

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=zrdqns&show_icons=true&count_private=true&line_height=25&${{ env.THEME }}
          path: cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=zrdqns&langs_count=8&layout=compact&title_color=DC2626&text_color=FFFFFF&bg_color=000000&border_color=DC2626
          path: cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin claude-code-band
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=zrdqns&repo=claude-code-band&${{ env.THEME }}
          path: cards/pin-claude-code-band.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin claude-code-usage
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=zrdqns&repo=claude-code-usage&${{ env.THEME }}
          path: cards/pin-claude-code-usage.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin claude-code-aside
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=zrdqns&repo=claude-code-aside&${{ env.THEME }}
          path: cards/pin-claude-code-aside.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin claude-code-converter
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=zrdqns&repo=claude-code-converter&${{ env.THEME }}
          path: cards/pin-claude-code-converter.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin texledger
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=zrdqns&repo=texledger&${{ env.THEME }}
          path: cards/pin-texledger.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase
          git push
